[project]
name = "simpledigestlying"
version = "0.1.0"
description = "A simple (or not) Telegram bot for Daily Digest!"
authors = [{ name = "Silletr", email = "silletrMain@gmail.com" }]
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
  "ollama>=0.6.2,<0.7.0",
  "python-dotenv (>=1.2.2,<2.0.0)",
  "tgcrypto (>=1.2.5,<2.0.0)",
  "pyrogram (>=2.0.106,<3.0.0)",
]

[tool.poetry]
package-mode = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
